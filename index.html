<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confession Letter</title>
    <style>
        body {
            background-color: #fce4ec;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            overflow: hidden;
        }

        .card {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 280px;
            position: relative;
        }

        .sticker {
            font-size: 65px;
            margin-bottom: 15px;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            position: relative;
            min-height: 50px;
        }

        button {
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        /* ဘယ်ဘက် No ခလုတ် */
        #noBtn {
            background-color: #f0f0f0;
            color: #666;
            z-index: 100;
        }

        /* ညာဘက် Yes ခလုတ် */
        #yesBtn {
            background-color: #ff4081;
            color: white;
            box-shadow: 0 3px 8px rgba(255, 64, 129, 0.4);
        }

        .hidden {
            display: none;
        }

        .letter-content {
            font-size: 15px;
            color: #444;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="card" id="questionCard">
        <div class="sticker">🥺</div>
        
        <h2>ႁၢႆၸႂ်လမ်လႆႈယဝ်ႉၼႃႈတူဝ်လဵၵ်ႉဝေ?</h2>
        
        <div class="btn-group">
            <button id="noBtn">ဢမ်ႇႁၢႆ ❌</button>
            <button id="yesBtn">ႁၢႆယဝ်ႉ ❤️</button>
        </div>
    </div>

    <div class="card hidden" id="letterCard">
        <div class="sticker">💌</div>
        <h2 style="color: #ff4081;">Confession Letter</h2>
        <div class="letter-content">
            <p>
               😜 ဝႃႈယူႇၼႃႇ ၼွင်ႉဢမ်ႇလႆႈၸႂ်လမ်ပီႈၼႆ ပီႈႁူႉယူႇ
                ၼွင်ႉၼႆႉလီႁၵ်ႉထူၼ်ႈယဝ်ႉ။ 😜
            </p>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const questionCard = document.getElementById('questionCard');
        const letterCard = document.getElementById('letterCard');

        // ပြောင်းချင်တဲ့ စာသား ၅ ခု (ကြိုက်သလို ပြင်ရေးနိုင်ပါတယ်)
        const messages = [
            "ၸႂ်လမ်တေႉတေႉႁႃႉ? 🥺",
            "ဝူၼ်ႉတူၺ်းလီလီၵွၼ်ႇ... 😥",
            "ႁၢႆၸႂ်လမ်သေၼႃႈ... 😭",
            "လီၵၼ်ၶိုၼ်းလႃႈ... 😭❤️",
            "ၼဵၵ်း ဢမ်ႇၸႂ်လမ်သေလႃႈ! 🥺"
        ];

        let clickCount = 0;

        // No ခလုတ် ပြေးရန် နှင့် စာသားပြောင်းရန် Function
        function handleNoInteraction(e) {
            if (e) e.preventDefault(); // ဖုန်းမှာ နှိပ်မရအောင် တားဆီးပေးသည်

            // ၁။ အနီးအနား လွတ်အောင် ပြေးမည်
            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;
            
            const randomX = Math.max(20, Math.floor(Math.random() * maxX));
            const randomY = Math.max(20, Math.floor(Math.random() * maxY));
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;

            // ၂။ ၅ ခါ မပြည့်မချင်း စာသား ပြောင်းပေးမည်
            if (clickCount < messages.length) {
                noBtn.innerText = messages[clickCount];
                clickCount++;
            }
        }

        // Mouse တင်ရင် သို့မဟုတ် ဖုန်းထဲမှာ ထိလိုက်ရင် အလုပ်လုပ်မည်
        noBtn.addEventListener('mouseover', handleNoInteraction);
        noBtn.addEventListener('touchstart', handleNoInteraction);
        noBtn.addEventListener('click', handleNoInteraction);

        // Yes ခလုတ် နှိပ်လျှင် ယေး...ၼွင်ႉႁၢႆၸႂ်လမ်ယဝ်ႉ ပေါ်လာမည်
        yesBtn.addEventListener('click', () => {
            questionCard.classList.add('hidden');
            letterCard.classList.remove('hidden');
        });
    </script>

</body>
</html>
