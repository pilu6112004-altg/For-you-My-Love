<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confession Letter</title>
    <style>
        body {
            background-color: #fce4ec;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Pyidaungsu', sans-serif;
        }

        .card {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 280px;
            position: relative;
        }

        .sticker {
            font-size: 60px;
            margin-bottom: 10px;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }

        h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            height: 50px;
            width: 100%;
        }

        button {
            padding: 10px 22px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #yesBtn {
            background-color: #ff4081;
            color: white;
            box-shadow: 0 3px 8px rgba(255, 64, 129, 0.4);
        }

        #noBtn {
            background-color: #f0f0f0;
            color: #666;
            position: absolute;
            right: 0;
            top: 0;
            z-index: 10;
        }

        .hidden {
            display: none;
        }

        .letter-content {
            font-size: 15px;
            color: #444;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="card" id="questionCard">
        <!-- Sticker အသဲပုံ ပြထားသည့်နေရာ -->
        <div class="sticker">💖🥺💖</div>
        
        <h2>ၼွင်ႉၼွင်ႉၸွင်ႇႁၵ်ႉပီႈပီႈႁႃႉ?</h2>
        
        <div class="btn-group">
            <button id="yesBtn">ႁၵ်ႉဢေႃႈ ❤️</button>
            <button id="noBtn">ဢမ်ႇႁၵ်ႉ ❌</button>
        </div>
    </div>

    <div class="card hidden" id="letterCard">
        <div class="sticker">💌</div>
        <h2 style="color: #ff4081;">Confession Letter</h2>
        <div class="letter-content">
            <p>
                ၶွပ်ႈၸႂ်ၵူႈလွင်ႈ ၵူၼ်းလီဝေ တီႈဢမ်ႇပွႆႇမိုဝ်းၵၼ်
                တေႃႇထိုင်ဝၼ်းမိူဝ်ႈၼႆႉ ႁၵ်ႉၼမ်ၼမ်ၼႃႈ။ ❤️
            </p>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const questionCard = document.getElementById('questionCard');
        const letterCard = document.getElementById('letterCard');

        // No ခလုတ်ကို ထိလိုက်လျှင် သို့မဟုတ် မောက်စ်တင်လိုက်လျှင် လွတ်အောင်ပြေးရန်
        function moveButton() {
            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;
            
            const randomX = Math.max(20, Math.floor(Math.random() * maxX));
            const randomY = Math.max(20, Math.floor(Math.random() * maxY));
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
        }

        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // ဖုန်းထဲမှာ နှိပ်မရအောင် တားဆီးပေးသည်
            moveButton();
        });

        // Yes ခလုတ်နှိပ်လျှင် စာလွှာပေါ်လာစေရန်
        yesBtn.addEventListener('click', () => {
            questionCard.classList.add('hidden');
            letterCard.classList.remove('hidden');
        });
    </script>

</body>
</html>
