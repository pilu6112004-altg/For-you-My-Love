<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confession Letter</title>
    <style>
        body {
            background-color: #fce4ec;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            overflow: hidden;
        }

        .card {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 280px;
            position: relative;
        }

        /* Sticker ဒီဇိုင်း */
        .sticker {
            font-size: 65px;
            margin-bottom: 15px;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            position: relative;
            min-height: 50px;
        }

        button {
            padding: 10px 22px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        /* ဘယ်ဘက် No ခလုတ် */
        #noBtn {
            background-color: #f0f0f0;
            color: #666;
        }

        /* ညာဘက် Yes ခလုတ် */
        #yesBtn {
            background-color: #ff4081;
            color: white;
            box-shadow: 0 3px 8px rgba(255, 64, 129, 0.4);
            z-index: 10;
        }

        .hidden {
            display: none;
        }

        .letter-content {
            font-size: 15px;
            color: #444;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="card" id="questionCard">
        <div class="sticker">💖🥺💖</div>
        
        <h2>ႁၢႆလွင်ႈၸႂ်လမ်လႆႈယဝ်ႉၼႃႈၵူၼ်းလီဝေ?</h2>
        
        <div class="btn-group">
            <button id="noBtn">ဢမ်ႇ ❌</button>
            <button id="yesBtn">ႁၢႆယဝ်ႉ ❤️</button>
        </div>
    </div>

    <div class="card hidden" id="letterCard">
        <div class="sticker">💌</div>
        <h2 style="color: #ff4081;">Confession Letter</h2>
        <div class="letter-content">
            <p>
                ယေး ဝႃႈယူႇလႄႇ ၼွင်ႉတိုၼ်းဢမ်ႇၸႂ်လမ်ပီႈပီႈ လီႁၵ်ႉထူၼ်ႈယဝ်ႉ
                ၼွင်ႉၼွင်ႉၼႆႉ ပီႈပီႈႁၵ်ႉၼႃႈ။ ❤️
            </p>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const questionCard = document.getElementById('questionCard');
        const letterCard = document.getElementById('letterCard');

        let scaleFactor = 1;

        // No ခလုတ် နှိပ်တိုင်း Yes ခလုတ် ကြီးလာစေရန်
        noBtn.addEventListener('click', () => {
            scaleFactor += 0.4; // နှိပ်လိုက်တိုင်း Yes က သိသိသာသာ ကြီးလာမည်
            yesBtn.style.transform = `scale(${scaleFactor})`;
        });

        // Yes ခလုတ် နှိပ်လျှင် Confession Letter ပေါ်လာစေရန်
        yesBtn.addEventListener('click', () => {
            questionCard.classList.add('hidden');
            letterCard.classList.remove('hidden');
        });
    </script>

</body>
</html>
