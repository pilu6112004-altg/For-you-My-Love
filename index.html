<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Confession</title>
    <style>
        body {
            background-color: #fce4ec;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            overflow: hidden;
            position: relative;
        }

        .card {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 290px;
            position: relative;
            z-index: 10;
        }

        .sticker {
            font-size: 65px;
            margin-bottom: 10px;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }

        .step-tag {
            font-size: 12px;
            color: #ff4081;
            font-weight: bold;
            background: #ffe4ec;
            padding: 4px 12px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 17px;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.5;
            min-height: 50px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            position: relative;
            min-height: 50px;
        }

        button {
            padding: 10px 22px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            touch-action: manipulation;
        }

        #noBtn {
            background-color: #f0f0f0;
            color: #666;
            z-index: 100;
        }

        #yesBtn {
            background-color: #ff4081;
            color: white;
            box-shadow: 0 3px 8px rgba(255, 64, 129, 0.4);
        }

        .hidden {
            display: none;
        }

        .letter-content {
            font-size: 15px;
            color: #444;
            line-height: 1.6;
        }

        .heart-rain {
            position: fixed;
            top: -10px;
            font-size: 20px;
            color: #ff4081;
            user-select: none;
            pointer-events: none;
            z-index: 1000;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="card" id="questionCard">
        <span class="step-tag" id="stepTag">Step 1 / 5</span>
        <div class="sticker" id="sticker">💖🥺💖</div>
        <h2 id="questionText">ကိုယ့်ကို တစ်ခုလောက် မေးခွင့်ပြုမလား?</h2>
        
        <div class="btn-group">
            <button id="noBtn">No ❌</button>
            <button id="yesBtn">Yes ❤️</button>
        </div>
    </div>

    <div class="card hidden" id="letterCard">
        <div class="sticker">💌</div>
        <h2 style="color: #ff4081; min-height: auto;">Confession Letter</h2>
        <div class="letter-content">
            <p>
                အဆင့်ဆင့် နှိပ်ပြီး ဝင်လာပေးလို့ ကျေးဇူးပါနော်...<br>
                တစ်နေ့နေ့မှာ မင်းနဲ့ဘဝတစ်ခုအတူတူ တည်ဆောက်ချင်လို့...<br>
                မင်းကို ကိုယ် အရမ်းချစ်တယ်။ ❤️
            </p>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const questionCard = document.getElementById('questionCard');
        const letterCard = document.getElementById('letterCard');
        
        const stepTag = document.getElementById('stepTag');
        const sticker = document.getElementById('sticker');
        const questionText = document.getElementById('questionText');

        const steps = [
            {
                tag: "Step 1 / 5",
                sticker: "💖🥺💖",
                question: "ကိုယ့်ကို တစ်ခုလောက် မေးခွင့်ပြုမလား?",
                yesText: "Yes ❤️",
                noText: "No ❌"
            },
            {
                tag: "Step 2 / 5",
                sticker: "😜✨",
                question: "No ကို နှိပ်ကြည့်ပါဦး... (Yes ကြီးလာလိမ့်မယ်!)",
                yesText: "Yes ❤️",
                noText: "No ❌"
            },
            {
                tag: "Step 3 / 5",
                sticker: "🤏🥹",
                question: "အခု No ကို ၅ ခါနှိပ်ရင် No ပျောက်သွားမယ်!",
                yesText: "Yes ❤️",
                noText: "No ❌"
            },
            {
                tag: "Step 4 / 5",
                sticker: "💬💓",
                question: "ဒါဆိုရင် စကားတွေ အမြဲတမ်း အတူတူ ပြောချင်လား?",
                yesText: "Yes ❤️",
                noText: "No ❌"
            },
            {
                tag: "Step 5 / 5 (နောက်ဆုံး)",
                sticker: "💍🌹❤️",
                question: "နောက်ဆုံး မေးခွန်းပါ... ကိုယ့်ရည်းစားလေး ဖြစ်ပေးမလား?",
                yesText: "Yes ❤️",
                noText: "No ❌"
            }
        ];

        let currentStep = 0;
        let step2Scale = 1;
        let step3Clicks = 0;
        let step3Scale = 1;
        let step4Messages = ["မလုပ်ပါနဲ့နော် 🥺", "သေချာ စဉ်းစားပါဦး 💔", "ငိုတော့မှာနော် 😭", "Yes ပဲ နှိပ်ပါတော့ ❤️"];
        let step4Index = 0;

        // Step 1 အတွက် ဖုန်းမှာ ထိရင် / mouse တင်ရင် ပြေးမည့် function
        function moveNoButton() {
            if (currentStep === 0) {
                const maxX = window.innerWidth - noBtn.offsetWidth - 20;
                const maxY = window.innerHeight - noBtn.offsetHeight - 20;
                const randomX = Math.max(20, Math.floor(Math.random() * maxX));
                const randomY = Math.max(20, Math.floor(Math.random() * maxY));
                
                noBtn.style.position = 'fixed';
                noBtn.style.left = `${randomX}px`;
                noBtn.style.top = `${randomY}px`;
            }
        }

        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('touchstart', (e) => {
            if (currentStep === 0) {
                e.preventDefault();
                moveNoButton();
            }
        });

        // Click Event (ဖုန်းမှာ ရော ကွန်ပျူတာမှာပါ သေချာ အလုပ်လုပ်စေရန်)
        noBtn.addEventListener('click', () => {
            if (currentStep === 0) {
                moveNoButton();
            }
            else if (currentStep === 1) {
                step2Scale += 0.3;
                yesBtn.style.transform = `scale(${step2Scale})`;
            } 
            else if (currentStep === 2) {
                step3Clicks++;
                step3Scale -= 0.18;
                if (step3Clicks >= 5) {
                    noBtn.style.display = 'none';
                } else {
                    noBtn.style.transform = `scale(${step3Scale})`;
                }
            }
            else if (currentStep === 3) {
                if (step4Index < step4Messages.length) {
                    noBtn.innerText = step4Messages[step4Index];
                    step4Index++;
                }
            }
        });

        // Yes ခလုတ် နှိပ်ရင် အဆင့်တက်ရန်
        yesBtn.addEventListener('click', () => {
            currentStep++;

            noBtn.style.position = 'static';
            noBtn.style.display = 'inline-block';
            noBtn.style.transform = 'scale(1)';
            yesBtn.style.transform = 'scale(1)';

            if (currentStep < steps.length) {
                stepTag.innerText = steps[currentStep].tag;
                sticker.innerText = steps[currentStep].sticker;
                questionText.innerText = steps[currentStep].question;
                yesBtn.innerText = steps[currentStep].yesText;
                noBtn.innerText = steps[currentStep].noText;
            } else {
                questionCard.classList.add('hidden');
                letterCard.classList.remove('hidden');
                startHeartRain();
            }
        });

        function startHeartRain() {
            const hearts = ['❤️', '💖', '💗', '💕', '🌹', '✨'];
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart-rain');
                heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = Math.random() * 2 + 3 + 's';
                heart.style.fontSize = Math.random() * 15 + 15 + 'px';
                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 5000);
            }, 150);
        }
    </script>

</body>
</html>
